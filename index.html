<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no,viewport-fit=cover">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<meta name="apple-mobile-web-app-title" content="Goshé">
<meta name="theme-color" content="#ffffff">
<title>Goshé.</title>
<link rel="manifest" href="manifest.webmanifest">
<link rel="apple-touch-icon" href="icon-180.png">
<link rel="stylesheet" href="style.css?v=1.7.0">
</head>
<body>
<div id="app">
  <!-- 영상 -->
  <div id="videoWrap">
    <div id="video"><div id="player"></div><div id="noVideo">클립 탭에서 링크를 추가해 주세요</div></div>
  </div>
  <div id="titlebar">
    <div id="logo"><span class="lA"><span class="n">Go</span>shé.</span><span class="lB"><span class="n">고성능</span> 쉐도잉.</span></div>
    <button id="fold" aria-label="영상 접기"><i></i></button>
  </div>

  <main id="pages">
    <!-- ① 클립 -->
    <section class="page" id="pClip">
      <div id="pasteRow"><div id="paste">
        <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="#9aa7b5" stroke-width="2"><path d="M10 14a5 5 0 0 0 7 0l3-3a5 5 0 0 0-7-7l-1 1"/><path d="M14 10a5 5 0 0 0-7 0l-3 3a5 5 0 0 0 7 7l1-1"/></svg>
        <input id="linkIn" type="url" inputmode="url" autocomplete="off" autocapitalize="off" spellcheck="false" placeholder="링크 붙여넣기">
        <button id="addBtn" aria-label="추가"><svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round"><path d="M12 5v14M5 12h14"/></svg></button>
      </div></div>
      <div id="clipPin"></div>
      <div id="clipList"></div>
      <input id="fileIn" type="file" accept=".json,application/json" hidden>
    </section>

    <!-- ② 쉐도잉 -->
    <section class="page" id="pShadow">
      <div class="shad" id="shad">
        <div class="top"><div class="speed" data-k="shadow"><button class="m" aria-label="느리게"><svg width="14" height="14" viewBox="0 0 14 14"><path d="M2 7h10" stroke="currentColor" stroke-width="1.8" stroke-linecap="round"/></svg></button><button class="v"></button><button class="p" aria-label="빠르게"><svg width="14" height="14" viewBox="0 0 14 14"><path d="M2 7h10M7 2v10" stroke="currentColor" stroke-width="1.8" stroke-linecap="round"/></svg></button></div></div>
        <div class="cnt"><button class="bm" id="shBm" aria-label="문장 저장"><svg width="25" height="25" viewBox="0 0 24 24"><path d="M6 3.5h12v17l-6-5-6 5z" fill="none" stroke="currentColor" stroke-width="2" stroke-linejoin="round"/></svg></button><em id="shCount"></em></div>
        <div class="trz"><div class="ko" id="shKo"></div><div class="wpop hidden" id="wpop"></div></div>
        <div class="sent" id="shSent"></div>
        <div class="msg" id="shMsg"></div>
      </div>
      <div class="micwrap"><div class="lights" id="lights"><span class="dot"><i></i></span><span class="dot"><i></i></span><span class="dot"><i></i></span></div><button class="listen" id="listenBtn" aria-label="듣기"></button><button class="mic" id="micBtn" aria-label="말하기"></button></div>
    </section>

    <!-- ③ 스크립트 -->
    <section class="page" id="pScript">
      <div class="ctrl">
        <div class="speed" data-k="script"><button class="m" aria-label="느리게"><svg width="14" height="14" viewBox="0 0 14 14"><path d="M2 7h10" stroke="currentColor" stroke-width="1.8" stroke-linecap="round"/></svg></button><button class="v"></button><button class="p" aria-label="빠르게"><svg width="14" height="14" viewBox="0 0 14 14"><path d="M2 7h10M7 2v10" stroke="currentColor" stroke-width="1.8" stroke-linecap="round"/></svg></button></div>
      </div>
      <div class="cnt"><button class="bm" id="scBm" aria-label="문장 저장"><svg width="25" height="25" viewBox="0 0 24 24"><path d="M6 3.5h12v17l-6-5-6 5z" fill="none" stroke="currentColor" stroke-width="2" stroke-linejoin="round"/></svg></button><em id="scCount"></em></div>
      <div id="drum"><div id="drumIn"></div></div>
      <div class="msg" id="scMsg"></div>
    </section>

    <!-- ④ 단어장 -->
    <section class="page" id="pVocab">
      <div class="vhead"><button class="vio" id="vExport" aria-label="단어장 내보내기"><svg width="25" height="25" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M12 15V3M7 8l5-5 5 5"/><path d="M5 13v6a2 2 0 0 0 2 2h10a2 2 0 0 0 2-2v-6"/></svg></button><button class="vio" id="vImport" aria-label="단어장 가져오기"><svg width="25" height="25" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M12 3v12M7 10l5 5 5-5"/><path d="M5 13v6a2 2 0 0 0 2 2h10a2 2 0 0 0 2-2v-6"/></svg></button><button class="vio" id="vUndo" aria-label="삭제 되돌리기" disabled><svg width="25" height="25" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M9 14 4 9l5-5"/><path d="M4 9h10.5a5.5 5.5 0 0 1 0 11H11"/></svg></button><input id="vFile" type="file" accept=".csv,text/csv,text/comma-separated-values" hidden><div class="toggle" id="vToggle"><span class="pill"></span><button data-m="ko">한</button><button data-m="en">영</button><button data-m="both">둘 다</button></div></div>
      <div id="vList"></div>
      <div class="search"><svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="#9aa7b5" stroke-width="2.2"><circle cx="11" cy="11" r="7"/><path d="M20 20l-4-4"/></svg><input id="vSearch" type="search" enterkeyhint="search" placeholder="저장한 단어 검색" autocomplete="off"><button id="vClear" class="hidden" aria-label="검색어 선택"><svg width="16" height="16" viewBox="0 0 16 16"><circle cx="8" cy="8" r="8" fill="#c3ccd6"/><path d="M5.3 5.3l5.4 5.4M10.7 5.3l-5.4 5.4" stroke="#fff" stroke-width="1.6" stroke-linecap="round"/></svg></button></div>
    </section>
  </main>

  <nav id="tabs">
    <button class="tab" data-t="pClip"><i><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><rect x="3" y="5" width="18" height="14" rx="3"/><path d="M10 9l5 3-5 3z" fill="currentColor"/></svg></i>클립</button>
    <button class="tab" data-t="pShadow"><i><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><rect x="9" y="3" width="6" height="11" rx="3"/><path d="M5 11a7 7 0 0 0 14 0M12 18v3"/></svg></i>쉐도잉</button>
    <button class="tab" data-t="pScript"><i><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M5 6h14M5 12h14M5 18h9"/></svg></i>스크립트</button>
    <button class="tab" data-t="pVocab"><i><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M5 4h11a3 3 0 0 1 3 3v13H8a3 3 0 0 1-3-3z"/><path d="M5 17a3 3 0 0 1 3-3h11"/></svg></i>단어장</button>
  </nav>
</div>

<!-- 설정 -->
<div id="sheet" class="hidden">
  <div class="sheetin">
    <div class="grab"></div>
    <div id="savedBox" hidden><div id="savedList"></div></div>
    <div id="setBox">
    <div class="sh">설정</div>
    <div class="fl">Gemini API 키</div>
    <div class="inp"><input id="sKey" type="password" autocomplete="off" autocapitalize="off" spellcheck="false" placeholder="AIza…"><button id="sPaste">붙여넣기</button></div>
    <div class="fl">모델</div>
    <div class="inp"><input id="sModel" type="text" autocomplete="off" autocapitalize="off" spellcheck="false"></div>
    <div class="fl">토큰 사용량</div>
    <div id="usage"></div>
    <div class="ver">Goshé. v1.7.0</div>
    </div>
  </div>
</div>

<!-- 확인창 -->
<div id="dlg" class="hidden"><div class="dlgin"><div id="dlgText"></div><div class="dlgbtns" id="dlgBtns"></div></div></div>

<script src="https://www.youtube.com/iframe_api" async></script>
<script src="app.js?v=1.7.0"></script>
</body>
</html>
